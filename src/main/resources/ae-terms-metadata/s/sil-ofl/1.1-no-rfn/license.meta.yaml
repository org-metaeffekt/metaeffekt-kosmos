# NOTE: we do not keep any license texts here because the base version of the license is the same as the variants, but we keep separate entries for identification purposes of IDs etc...
canonicalName: SIL Open Font License 1.1 (no reserved font name)
category: OFL
spdxIdentifier: OFL-1.1-no-RFN

otherIds:
  - "osi:OFL-1.1"
  - "scancode:ofl-1.1-no-rfn"

expectedMatches:
  - "SIL Open Font License 1.1"

alternativeNames:
  - "Open Font License 1.1 without reserved font"
  - "SIl-OFL-1.1-no-reserved-font"
  - "OFL, Version 1.1, No Reserved Font"
  - "OFL, 1.1: No Reserved Font"
  - "OFL 1.1 No Reserved Font"
  - "OFL-1.1 No Reserved Font"
  - "SIL OPEN FONT LICENSE Version 1.1 NO RESERVED FONT"
  - "SIL Open Font License, Version 1.1 no reserved font"
  - "Open Font License v1.1 no reserved font"
  - "SIL Open Font License V1.1 no reserved font"
  - "ofl-1.1-no-rfn"
  - "OFL 1.1 no Reserved Font Name"
  - "SIL Open Font License 1.1 with no Reserved Font Name"

evidence:
  matches:
    - "with no Reserved Font Name for this Font Software"
    - "The requirement for fonts to remain under this license does not
       apply to any document created using the fonts or their derivatives"
    - "Permission is hereby granted, free of charge, to any person obtaining a copy
       of the Font Software, to use, study, copy, merge, embed, modify, redistribute,
       and sell modified and unmodified copies of the Font Software, subject to the
       following conditions"
    - "Neither the Font Software nor any of its individual components, in Original or Modified Versions, may be sold by itself"
    - "No Modified Version of the Font Software may use the Reserved Font Name(s)
      unless explicit written permission is granted by the corresponding Copyright Holder"
    - "The Font Software, modified or unmodified, in part or in whole, must be
       distributed entirely under this license, and must not be distributed under
       any other license"
    - "The requirement for fonts to remain under this license does not apply to any document
       created using the Font Software"

segmentation:
  revert: [
    {
      match:
        "This Font Software is licensed under the SIL Open Font License, Version 1.1. with no Reserved Font Name for this Font Software. This license is copied below, and is also available with a FAQ at: http://scripts.sil.org/OFL",
      matchNext:
        "SIL OPEN FONT LICENSE Version 1.1 - 26 February 2007"
    },
]
