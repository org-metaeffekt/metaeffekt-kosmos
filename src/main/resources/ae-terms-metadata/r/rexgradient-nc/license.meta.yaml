       in Article III of this Agreement"
    - "Either party may terminate this agreement for any reason at any time, however, 
       YOUR obligations that by their nature are intended to persist following termination shall remain 
       in effect even after termination"
    - "Upon termination, YOU shall immediately cease use of the Data and destroy Data in YOUR possession and,
       if requested by Harvard, certify to Harvard as to its destruction"

