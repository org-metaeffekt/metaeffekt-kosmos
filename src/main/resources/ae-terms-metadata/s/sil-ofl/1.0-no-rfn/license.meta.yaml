# NOTE: we do not keep any license texts here because the base version of the license is the same as the variants, but we keep separate entries for identification purposes of IDs etc...
canonicalName: SIL Open Font License 1.0 (no reserved font name)
category: OFL
spdxIdentifier: OFL-1.0-no-RFN

otherIds:
  - "scancode:ofl-1.0-no-rfn"

expectedMatches:
  - "SIL Open Font License 1.0"

alternativeNames:
  - "OFL-1.0-no-RFN"
  - "ofl-1.0-no-rfn"
  - "SIL Open Font License 1.0 with no Reserved Font Name"
  - "SIL Open Font License, Version 1.0.
     with no Reserved Font Name"
  - "Open Font License v1.0 with no Reserved Font Name"
  - "OFL 1.0 no Reserved Font Name"

evidence:
  matches:
    - "Font Software is licensed under the SIL Open Font License, Version 1.0.
       with no Reserved Font Name for this Font Software"
    - "The OFL allows the licensed fonts to be used, studied, modified and redistributed
       freely as long as they are not sold by themselves"
    - "The fonts, including any derivative works, can be bundled, embedded, redistributed
       and sold with any software provided that the font names of derivative works are changed"
    - "The fonts and derivatives, however, cannot be released under any other type of license"
    - "Permission is hereby granted, free of charge, to any person obtaining a copy
       of the Font Software, to use, study, copy, merge, embed, modify, redistribute,
       and sell modified and unmodified copies of the Font Software, subject to the
       following conditions"
    - "The Font Software, modified or unmodified, in part or in whole, must be
       distributed using this license, and may not be distributed under any other
       license"

# NOTE: these reverts were created based on the scancode version of the license.
segmentation:
  revert: [
    { match:
        "This Font Software is licensed under the SIL Open Font License, Version 1.0. with no Reserved Font Name for this Font Software. No modification of the license is permitted, only verbatim copy is allowed. This license is copied below, and is also available with a FAQ at: http://scripts.sil.org/OFL",
      matchNext:
        "SIL OPEN FONT LICENSE Version 1.0 - 22 November 2005"
    },
    { match:
        "SIL OPEN FONT LICENSE Version 1.0 - 22 November 2005",
      matchNext:
        "PREAMBLE The goals of the Open Font License (OFL) are to stimulate worldwide development of cooperative font projects"
    },
  ]